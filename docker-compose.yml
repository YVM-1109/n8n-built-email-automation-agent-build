version: '3.8'

# ============================================================
# Email Management Agent - Docker Compose Stack
# Self-hosted, scalable, fault-tolerant email automation
# ============================================================

services:
  # PostgreSQL - Primary database for n8n executions & metadata
  postgres:
    image: postgres:15-alpine
    container_name: email-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-agent-network

  # Redis - Queue broker, caching, deduplication
  redis:
    image: redis:7-alpine
    container_name: email-agent-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - email-agent-network

  # Qdrant - Vector database for RAG (email embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: email-agent-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - email-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # n8n - Workflow automation engine
  n8n:
    image: n8nio/n8n:latest
    container_name: email-agent-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change_me_now}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password_change_me}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_MODE: regular
      EXECUTIONS_MODE: regular
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 20
      EXECUTIONS_TIMEOUT: 300
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_this_to_random_32_chars}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - email-agent-network

  # Prometheus - Metrics collection (optional, uncomment to enable)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: email-agent-prometheus
  #   restart: unless-stopped
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - email-agent-network

  # Grafana - Visualization dashboards (optional, uncomment to enable)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: email-agent-grafana
  #   restart: unless-stopped
  #   environment:
  #     GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana_password}
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #     - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/email-agent.json
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - email-agent-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  n8n_data:
  # prometheus_data:
  # grafana_data:

networks:
  email-agent-network:
    driver: bridge
